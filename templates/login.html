<!DOCTYPE html>
<html>
<head>
    <title>Identificação Necessária</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 40px; }
        input { padding: 10px; margin: 10px 0; width: 80%; }
        button { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 5px; cursor: pointer;}
        .error { color: red; font-size: 0.9em; display: none; }
    </style>
    <script>
        function validarCPF(cpf) {
            cpf = cpf.replace(/[^\d]+/g, '');
            if (cpf == '') return false;
            // Elimina CPFs invalidos conhecidos
            if (cpf.length != 11 ||
                cpf == "00000000000" ||
                cpf == "11111111111" ||
                cpf == "22222222222" ||
                cpf == "33333333333" ||
                cpf == "44444444444" ||
                cpf == "55555555555" ||
                cpf == "66666666666" ||
                cpf == "77777777777" ||
                cpf == "88888888888" ||
                cpf == "99999999999")
                return false;
            // Valida 1o digito
            add = 0;
            for (i = 0; i < 9; i++)
                add += parseInt(cpf.charAt(i)) * (10 - i);
            rev = 11 - (add % 11);
            if (rev == 10 || rev == 11)
                rev = 0;
            if (rev != parseInt(cpf.charAt(9)))
                return false;
            // Valida 2o digito
            add = 0;
            for (i = 0; i < 10; i++)
                add += parseInt(cpf.charAt(i)) * (11 - i);
            rev = 11 - (add % 11);
            if (rev == 10 || rev == 11)
                rev = 0;
            if (rev != parseInt(cpf.charAt(10)))
                return false;
            return true;
        }

        function validarFormulario(event) {
            var cpfInput = document.getElementById('cpf');
            var errorMsg = document.getElementById('cpf-error');
            
            if (!validarCPF(cpfInput.value)) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = 'CPF Inválido. Verifique os números.';
                event.preventDefault();
                return false;
            }
            errorMsg.style.display = 'none';
            return true;
        }
    </script>
</head>
<body>
    <h2>🔒 Quem é você?</h2>
    
    <form action="/auth/login" method="post" onsubmit="validarFormulario(event)">
        <input type="text" name="nome_usuario" placeholder="Seu Nome Completo" required>
        <input type="text" id="cpf" name="cpf_usuario" placeholder="Seu CPF (apenas números)" required maxlength="14">
        <div id="cpf-error" class="error"></div>
        
        <input type="password" name="senha" placeholder="Senha gerada pelo administrador" required>

        <input type="hidden" name="proximo_passo" value="{{ codigo_alvo }}">
        
        <br>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
